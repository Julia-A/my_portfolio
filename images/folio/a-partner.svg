<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1521 910" role="img" aria-labelledby="title desc">
  <title id="title">A-partner dashboard screenshot</title>
  <desc id="desc">A dark A-partner goal tracker dashboard with sidebar navigation, progress cards, today's focus, and a new goal button.</desc>
  <defs>
