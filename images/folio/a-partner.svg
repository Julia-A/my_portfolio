      <circle cx="52" cy="249" r="11" stroke="#a7a9af"/><circle cx="52" cy="249" r="5" stroke="#a7a9af"/>
      <path d="M42 333v-18M52 333v-12M62 333v-20M42 333h24" stroke="#a7a9af"/>
      <path d="M52 389l4 7 8 1-6 6 1 8-7-4-7 4 1-8-6-6 8-1 4-7z" stroke="#a7a9af"/>
    </g>
  </g>
  <line x1="17" y1="681" x2="297" y2="681" stroke="#3c3d43"/>
  <g transform="translate(17 719)" font-family="Inter, Arial, sans-serif">
