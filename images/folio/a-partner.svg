    <path d="M17 14h18v7c0 8-5 13-9 13s-9-5-9-13v-7zM15 18h-5c0 8 5 11 8 11M37 18h5c0 8-5 11-8 11M22 37h8M19 41h14" fill="none" stroke="#f3a85f" stroke-width="2"/>
