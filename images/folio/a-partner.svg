      <stop offset="0" stop-color="#2b2c31"/>
      <stop offset="1" stop-color="#242529"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1521" height="910" fill="#18191c"/>
  <rect width="331" height="910" fill="#2a2b30"/>
  <line x1="331" y1="0" x2="331" y2="910" stroke="#3a3c42"/>
